<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gráfica del equipo de enfermería</title>
<style id="css">
:root{
  --temp:#d62828; --fc:#1d4ed8; --ta:#15803d; --fr:#111111;
  --bg:#f6f7f9; --card:#ffffff; --line:#e3e6ea; --grid:#eef0f3; --grid2:#d9dde3;
  --text:#1f2933; --muted:#66727f; --accent:#0f766e; --warn:#b45309;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.4}
header.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header.top h1{font-size:19px;margin:0;font-weight:650;display:flex;align-items:center;gap:10px}
.logo{display:inline-flex;align-items:center;gap:2px;flex:none}
#status{font-size:12.5px;color:var(--muted)}
#status.ok::before{content:"● ";color:#16a34a}
#status.local::before{content:"● ";color:var(--warn)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 12px;font-weight:650}
.card h3{font-size:14px;margin:14px 0 8px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.grid{display:grid;gap:10px}
.pac{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:4px}
input,select,textarea{font:inherit;color:var(--text);padding:7px 9px;border:1px solid #cfd5dc;border-radius:7px;background:#fff;min-width:0}
input:focus,select:focus{outline:2px solid #99d5cf;border-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid #cfd5dc;background:#fff;padding:7px 12px;color:var(--text)}
button:hover{background:#f1f3f5}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#0d655e}
button.danger{color:#b91c1c}
button.small{padding:3px 8px;font-size:12.5px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs a{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--text);background:#fff;border:1px solid var(--line);font-weight:600;font-size:14px}
.tabs a.on{background:var(--text);color:#fff;border-color:var(--text)}
.form-cv{grid-template-columns:1.6fr repeat(5,1fr) 1.6fr auto;align-items:end}
.form-bh{grid-template-columns:1.6fr 1fr 1.6fr 1fr 1.6fr auto;align-items:end}
@media (max-width:900px){.form-cv,.form-bh{grid-template-columns:1fr 1fr}}
.lab-temp{color:var(--temp)} .lab-fc{color:var(--fc)} .lab-ta{color:var(--ta)} .lab-fr{color:var(--fr)}
.lab-temp,.lab-fc,.lab-ta,.lab-fr{font-weight:700}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;margin:4px 0 10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:0;border-top:3px solid;display:inline-block}
.chartwrap{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
#axes{flex:none;border-right:1px solid var(--grid2);background:#fcfcfd}
#plotScroll{overflow-x:auto;flex:1}
.empty{padding:40px;text-align:center;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.02em;background:#fafbfc}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.alto{background:#fde8e8;font-weight:700;border-radius:4px;padding:1px 5px}
.bajo{background:#e6effd;font-weight:700;border-radius:4px;padding:1px 5px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.seg{display:inline-flex;border:1px solid #cfd5dc;border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 12px}
.seg button.on{background:var(--text);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:8px 0 14px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.kpi .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:#1d4ed8} .neg{color:#b91c1c}
tr.sub td{font-weight:700;background:#fafbfc}
tr.tot td{font-weight:800;border-top:2px solid var(--text)}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.toolbar .sp{flex:1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 14px;font-size:14px;background:#fff}
.chip.on .hint{color:inherit;opacity:.85}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.todos{border-style:solid;font-weight:600}
.chip.todos.on{background:var(--text);border-color:var(--text)}
.chip.nuevo{border-style:dashed;color:var(--accent);font-weight:600}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:9px 16px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10}
.modal.show{display:flex}
.modal .box{background:#fff;border-radius:10px;padding:18px;max-width:380px;width:90%}
.modal .box p{margin:0 0 14px}
.modal .row{display:flex;gap:8px;justify-content:flex-end}
textarea{width:100%;min-height:90px;resize:vertical}
.form-gen{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
.alerta{background:#fde8e8;border:1px solid #f1a9a9;color:#9b1c1c;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:600}
.alerta:empty{display:none}
.med{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-bottom:10px}
.medtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.tomas{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
button.slot{min-width:70px;height:38px;font-weight:700;border:2px solid #0f766e;color:#0f766e;background:#fff;padding:0 12px}
button.slot.on{background:#0f766e;color:#fff}
.estados{display:flex;gap:6px;flex-wrap:wrap}
button.est{border-radius:999px;padding:6px 11px;font-size:14px;font-weight:600}
button.est.on.ok{background:#15803d;border-color:#15803d;color:#fff}
button.est.on.mid{background:#b45309;border-color:#b45309;color:#fff}
button.est.on.bad{background:#b91c1c;border-color:#b91c1c;color:#fff}
.xbtn{min-width:36px;height:32px;font-weight:800;color:#0f766e;border:2px solid #0f766e;background:#fff;padding:0 8px;font-size:15px}
.xbtn:hover{background:#0f766e;color:#fff}
button.hora{border-color:#0f766e;color:#0f766e;font-variant-numeric:tabular-nums}
@media (max-width:700px){.tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.tabs a{white-space:nowrap}}
svg text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script type="application/json" id="state">{"pacientes":[],"activo":null,"savedAt":0}</script>
<script id="app">
(function(){
"use strict";
var PROF = false;
var LSKEY = PROF ? "grafica-equipo-prof" : "grafica-equipo-v1";
var ICO = {datos:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><rect x='3' y='5' width='18' height='14' rx='2'/><circle cx='9' cy='11' r='2.2'/><path d='M5.5 16c.7-1.6 2-2.3 3.5-2.3s2.8.7 3.5 2.3M15 10h3.5M15 13.5h3.5'/></svg>",valoracion:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><rect x='5' y='4' width='14' height='17' rx='2'/><path d='M9 4V3h6v1M9 11l2 2 4-4M9 17h6'/></svg>",constantes:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z'/><path d='M7 12h2.5l1.5-3 2 5 1.5-2H17'/></svg>",balance:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z'/><path d='M9.5 15a2.5 2.5 0 0 0 2.5 2.5'/></svg>",tratamiento:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><rect x='3' y='9' width='18' height='6' rx='3' transform='rotate(-40 12 12)'/><path d='M9.5 7.2l7.3 7.3' transform='rotate(0 12 12)'/></svg>",cuidados:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M3 18V7M3 14h18v4M21 14v-2a3 3 0 0 0-3-3h-7v5'/><circle cx='7' cy='11' r='1.8'/></svg>",curas:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><rect x='2.5' y='8.5' width='19' height='7' rx='3.5' transform='rotate(-35 12 12)'/><rect x='9' y='9.5' width='6' height='5' transform='rotate(-35 12 12)'/><path d='M11.2 11.3h.01M12.8 12.7h.01'/></svg>",pruebas:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M9 3h6M10 3v6.5L5.5 18a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 9.5V3'/><path d='M8 15h8'/></svg>",incidencias:"<svg width='21' height='21' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'><path d='M12 3.5l9.5 16.5h-19z'/><path d='M12 10v4.5M12 17.2h.01'/></svg>"};
/* ---------- Estado ---------- */
/* db = {pacientes:[{id,paciente,constantes,balance,ajustes}], activo, savedAt}
   state = paciente activo (se reasigna al cambiar de paciente) */
function nuevoPaciente(){return {id:uid(),paciente:{nombre:"",hab:"",historia:"",edad:"",peso:"",ingreso:"",diagnostico:""},constantes:[],balance:[],ajustes:{insensibles:false},tto:[],admin:[],inc:{},cuidadosLista:[],cuidados:[],curas:[],pruebas:[]}}
function migrar(raw){
  if(!raw) return null;
  if(raw.pacientes) return raw;
  var p=nuevoPaciente();
  p.paciente=raw.paciente||p.paciente;p.constantes=raw.constantes||[];p.balance=raw.balance||[];p.ajustes=raw.ajustes||p.ajustes;
  var vacio=!p.constantes.length&&!p.balance.length&&!Object.keys(p.paciente).some(function(k){return p.paciente[k]});
  return {pacientes:vacio?[]:[p],activo:vacio?null:p.id,savedAt:raw.savedAt||0};
}
var SEED = migrar(JSON.parse(document.getElementById("state").textContent));
var db = SEED;
try{
  var ls = migrar(JSON.parse(localStorage.getItem(LSKEY) || "null"));
  if(ls && (ls.savedAt||0) > (SEED.savedAt||0)) db = ls;
}catch(e){}
db.pacientes.forEach(function(p){completar(p)});
if(!db.pacientes.length){var p0=nuevoPaciente();db.pacientes.push(p0);db.activo=p0.id}
var state = null;
function activar(id){
  state = db.pacientes.filter(function(p){return p.id===id})[0] || db.pacientes[0];
  db.activo = state.id; diaSel = null; fechaSel = ""; editTT = null; diaInc = null;
}

var artifactApi = null, canPublish = false, pubTimer = null;
var VISTAS = ["datos","valoracion","constantes","balance","tratamiento","cuidados","curas","pruebas","incidencias"];
function vistaDeHash(){var h=location.hash.replace("#","");return (h==="resumen"||VISTAS.indexOf(h)>=0)?h:"datos"}
var vista = vistaDeHash();
var tipoBH = "ingreso";
var diaSel = null;

var CONCEPTOS = {
  ingreso:["Vía oral","Sueroterapia IV","Medicación IV","Nutrición enteral","Nutrición parenteral","Hemoderivados","Otros ingresos"],
  egreso:["Diuresis","Deposiciones","Vómitos","Drenajes","Aspirado SNG","Sudoración","Otras pérdidas"]
};
var TURNOS = [{id:"M",n:"Mañana",d:"8–15 h",h:7},{id:"T",n:"Tarde",d:"15–22 h",h:7},{id:"N",n:"Noche",d:"22–8 h",h:10}];

/* Escalas: 8 divisiones numeradas, cada una con 4 espacios iguales (T 0,25 · FC 5 · TA 5 · FR 1) */
var ESC = {
  temp:{min:34,max:42,paso:1,col:"var(--temp)",hex:"#d62828",lab:"T ª (°C)"},
  fc:{min:40,max:200,paso:20,col:"var(--fc)",hex:"#1d4ed8",lab:"FC (lpm)"},
  ta:{min:40,max:200,paso:20,col:"var(--ta)",hex:"#15803d",lab:"TA (mmHg)"},
  fr:{min:4,max:36,paso:4,col:"var(--fr)",hex:"#111111",lab:"FR (rpm)"}
};

/* ---------- Utilidades ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function pad(n){return (n<10?"0":"")+n}
function ahoraLocal(){var d=new Date();d.setSeconds(0,0);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())}
function fFecha(t){var d=new Date(t);return pad(d.getDate())+"/"+pad(d.getMonth()+1)}
function fHora(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
function fFull(t){var d=new Date(t);return fFecha(t)+"/"+d.getFullYear()+" "+fHora(t)}
function num(v){if(v===""||v==null)return null;var n=parseFloat(String(v).replace(",","."));return isNaN(n)?null:n}
function fmt(n,dec){if(n==null)return "";return Number(n).toLocaleString("es-ES",{minimumFractionDigits:dec||0,maximumFractionDigits:dec||0})}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1800)}
function confirmar(msg,ok){var m=$("#modal");$("#modalMsg").textContent=msg;m.classList.add("show");
  $("#modalOk").onclick=function(){m.classList.remove("show");ok()};$("#modalNo").onclick=function(){m.classList.remove("show")}}

/* Día de balance: de 8:00 a 8:00 */
function diaBalance(t){var d=new Date(t-8*3600000);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fDia(k){var p=k.split("-");return p[2]+"/"+p[1]+"/"+p[0]}
function turnoDe(t){var h=new Date(t).getHours();return (h>=8&&h<15)?"M":(h>=15&&h<22)?"T":"N"}

/* Rangos de referencia (adulto) para resaltar */
function marca(tipo,v){
  if(v==null)return "";
  var r={temp:[36,38],fc:[60,100],tas:[90,140],tad:[60,90],fr:[12,20]}[tipo];
  if(tipo==="temp"){ if(v>=38)return "alto"; if(v<36)return "bajo"; return ""; }
  if(v>r[1]||(tipo==="tas"&&v>=140)||(tipo==="tad"&&v>=90))return "alto";
  if(v<r[0])return "bajo"; return "";
}
function celda(tipo,v,dec){if(v==null)return "—";var c=marca(tipo,v);var s=fmt(v,dec);return c?'<span class="'+c+'">'+s+'</span>':s}

/* ---------- Guardado ---------- */
function guardar(){
  db.savedAt = Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(db))}catch(e){}
  if(canPublish){
    setStatus("Guardando…","");
    clearTimeout(pubTimer);
    pubTimer=setTimeout(publicar,1200);
  }else{
    setStatus("Guardado solo en este navegador","local");
  }
}
function documento(){
  var css=document.getElementById("css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify(db).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Gráfica del equipo de enfermería</title>\n<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<div id=\"root\"></div>\n<script type=\"application/json\" id=\"state\">"+json+"<\/script>\n<script id=\"app\">"+app+"<\/script>\n</body>\n</html>\n";
}
function publicar(){
  if(!artifactApi)return;
  try{sessionStorage.setItem("grafica-enf-scroll",String(window.scrollY))}catch(e){}
  Promise.resolve().then(function(){return artifactApi.publish(documento())}).then(function(){
    setStatus("Guardado","ok");
  }).catch(function(err){
    var c=(err&&(err.code||err.name||err.message))||"";
    if(/not_granted|not_writer/.test(c)){canPublish=false;setStatus("Solo lectura · guardado en este navegador","local")}
    else if(/conflict/.test(c)){setStatus("Otra pestaña guardó a la vez; recargando","local")}
    else setStatus("No se pudo guardar en la página · guardado en este navegador","local");
  });
}
function descargarTrabajo(){
  var msg=$("#envioMsg"), nom=($("#alumnoNombre").value||"").trim();
  if(!nom){msg.style.color="#b91c1c";msg.textContent="Escribe tu nombre para poder descargar.";return}
  try{localStorage.setItem("grafica-enf-alumno",nom)}catch(e){}
  var mios=db.pacientes.filter(function(p){return !p.alumno});
  var datos={tipo:"grafica-enfermeria",version:1,alumno:nom,fecha:new Date().toISOString(),pacientes:mios};
  var limpio=nom.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||"alumno";
  var blob=new Blob([JSON.stringify(datos)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Grafica_"+limpio+".json";
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
  msg.style.color="#15803d";msg.textContent="Archivo descargado ("+mios.length+" paciente(s)). Súbelo a Classroom.";
}
function cargarArchivos(files){
  var msg=$("#cargaMsg"), lista=Array.prototype.slice.call(files||[]);
  if(!lista.length)return;
  var nuevos=0, alumnos=[], errores=0, pend=lista.length;
  lista.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d||d.tipo!=="grafica-enfermeria"||!Array.isArray(d.pacientes))throw 0;
        var al=String(d.alumno||"Sin nombre").slice(0,80);
        d.pacientes.forEach(function(p){
          if(!p||!p.paciente||!Array.isArray(p.constantes)||!Array.isArray(p.balance))return;
          var origen=al+"|"+p.id;
          db.pacientes=db.pacientes.filter(function(x){return x.origen!==origen});
          p.origen=origen;p.alumno=al;p.id=uid();
          completar(p);
          db.pacientes.push(p);nuevos++;
        });
        if(alumnos.indexOf(al)<0)alumnos.push(al);
      }catch(e){errores++}
      if(--pend===0){
        guardar();render();
        var m=$("#cargaMsg");
        if(m){m.style.color=errores?"#b91c1c":"#15803d";m.textContent=nuevos+" paciente(s) cargados de "+alumnos.length+" alumno(s)"+(errores?" · "+errores+" archivo(s) no válidos":"")}
      }
    };
    rd.onerror=function(){errores++;if(--pend===0){render()}};
    rd.readAsText(f);
  });
}
function setStatus(t,c){var s=$("#status");if(!s)return;s.textContent=t;s.className=c||""}

/* ---------- Render principal ---------- */
function render(){
  var r=$("#root");

function tablaCV(regs){

  });
  return h+'</tbody></table></div>';
}
function csvCV(regs){
  var l=["Fecha;Hora;TAS;TAD;FC;Temperatura;FR;Observaciones"];
  regs.forEach(function(r){l.push([fFecha(r.t)+"/"+new Date(r.t).getFullYear(),fHora(r.t),r.tas==null?"":r.tas,r.tad==null?"":r.tad,r.fc==null?"":r.fc,r.temp==null?"":String(r.temp).replace(".",","),r.fr==null?"":r.fr,(r.obs||"").replace(/;/g,",")].join(";"))});
  return l.join("\n");
}

function dibujarGrafica(regs){
  var TOP=24, H=512, BOT=56, DIV=8, SUB=4, COLW=64, PADL=24, PADR=30;
  var totalH=TOP+H+BOT;
  function fmtEje(v){return Number.isInteger(v)?String(v):String(v).replace(".",",")}
  function y(v,s){var e=ESC[s];var c=Math.max(e.min,Math.min(e.max,v));return TOP+H*(1-(c-e.min)/(e.max-e.min))}
  /* Ejes (columnas de escala, como en la gráfica en papel) */
  var cols=["ta","fc","temp","fr"], AW=58, ax='<svg width="'+(AW*cols.length)+'" height="'+totalH+'" role="img" aria-label="Escalas">';
  cols.forEach(function(s,i){
    var e=ESC[s], x=i*AW+AW/2;
    ax+='<text x="'+x+'" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="'+e.hex+'">'+e.lab.split(" ")[0]+'</text>';
    var bx=i*AW+9;
    ax+='<line x1="'+bx+'" y1="'+TOP+'" x2="'+bx+'" y2="'+(TOP+H)+'" stroke="'+e.hex+'" stroke-width="3" stroke-opacity=".55"/>';
    for(var j=0;j<=DIV*SUB;j++){if(j%SUB===0)continue;var ym=TOP+H*(1-j/(DIV*SUB));
      ax+='<line x1="'+bx+'" y1="'+ym+'" x2="'+(bx+5)+'" y2="'+ym+'" stroke="'+e.hex+'" stroke-width="1.5" stroke-opacity=".5"/>';}
    for(var k=0;k<=DIV;k++){var val=e.min+k*e.paso;var yy=TOP+H*(1-k/DIV);
      ax+='<line x1="'+bx+'" y1="'+yy+'" x2="'+(bx+10)+'" y2="'+yy+'" stroke="'+e.hex+'" stroke-width="3" stroke-opacity=".55"/>'+
        '<text x="'+(bx+14)+'" y="'+(yy+4)+'" text-anchor="start" font-size="12" font-weight="700" fill="'+e.hex+'">'+fmtEje(val)+'</text>';}
    ax+='<text x="'+x+'" y="'+(TOP+H+22)+'" text-anchor="middle" font-size="10" fill="#66727f">'+e.lab.replace(/^[^(]*/,"")+'</text>';
    if(i>0) ax+='<line x1="'+(i*AW)+'" y1="0" x2="'+(i*AW)+'" y2="'+totalH+'" stroke="#e3e6ea"/>';
  });
  ax+='</svg>';
  $("#axes").innerHTML=ax;

  var n=regs.length, W=Math.max(PADL+PADR+n*COLW, 600);
  function x(i){return PADL+COLW/2+i*COLW}
  var s='<svg width="'+W+'" height="'+totalH+'" role="img" aria-label="Gráfica de constantes vitales">';
  /* Cuadrícula */
  for(var k=0;k<=DIV*SUB;k++){var yy=TOP+H*k/(DIV*SUB);var mayor=k%SUB===0;
    s+='<line x1="0" y1="'+yy+'" x2="'+W+'" y2="'+yy+'" stroke="'+(mayor?"#8d97a3":"#e3e6ea")+'" stroke-width="'+(mayor?1.5:1)+'"/>';}
  /* Línea de 37 °C */
  var y37=y(37,"temp");
  s+='<line x1="0" y1="'+y37+'" x2="'+W+'" y2="'+y37+'" stroke="#d62828" stroke-dasharray="5 4" stroke-opacity=".45"/>';
  /* Columnas por registro y cambio de día */
  var diaAnt=null;
  regs.forEach(function(r,i){
    var xc=x(i), d=fFecha(r.t);
    s+='<line x1="'+(xc-COLW/2)+'" y1="'+TOP+'" x2="'+(xc-COLW/2)+'" y2="'+(TOP+H)+'" stroke="'+(d!==diaAnt&&i>0?"#9aa3ad":"#f1f2f4")+'"/>';
    s+='<text x="'+xc+'" y="'+(TOP+H+20)+'" text-anchor="middle" font-size="12" font-weight="'+(d!==diaAnt?"700":"400")+'" fill="#1f2933">'+(d!==diaAnt?d:"")+'</text>';
    s+='<text x="'+xc+'" y="'+(TOP+H+37)+'" text-anchor="middle" font-size="12" fill="#66727f">'+fHora(r.t)+'</text>';
    diaAnt=d;
  });
  /* Líneas */
  function linea(campo,esc,color,ancho,dash){
    var pts=[];regs.forEach(function(r,i){if(r[campo]!=null)pts.push(x(i)+","+y(r[campo],esc))});
    if(pts.length>1) s+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="'+ancho+'" stroke-linejoin="round"'+(dash?' stroke-dasharray="'+dash+'"':'')+'/>';
  }
  /* TA: barra vertical sistólica–diastólica con topes */
  regs.forEach(function(r,i){
    if(r.tas==null)return;
    var xc=x(i)-12, y1=y(r.tas,"ta"), y2=y(r.tad,"ta");
    s+='<g><title>TA '+r.tas+'/'+r.tad+' mmHg · '+fFull(r.t)+'</title>'+
      '<line x1="'+xc+'" y1="'+y1+'" x2="'+xc+'" y2="'+y2+'" stroke="#15803d" stroke-width="3"/>'+
      '<path d="M'+(xc-6)+' '+(y1-6)+' L'+xc+' '+y1+' L'+(xc+6)+' '+(y1-6)+'" fill="none" stroke="#15803d" stroke-width="2.5"/>'+
      '<path d="M'+(xc-6)+' '+(y2+6)+' L'+xc+' '+y2+' L'+(xc+6)+' '+(y2+6)+'" fill="none" stroke="#15803d" stroke-width="2.5"/>'+
      '<text x="'+(xc-4)+'" y="'+(y1-9)+'" text-anchor="middle" font-size="10" fill="#15803d">'+r.tas+'</text>'+
      '<text x="'+(xc-4)+'" y="'+(y2+18)+'" text-anchor="middle" font-size="10" fill="#15803d">'+r.tad+'</text></g>';
  });
  linea("fr","fr","#111111",2);
  linea("fc","fc","#1d4ed8",2.2);
  linea("temp","temp","#d62828",2.5);
  /* Puntos */
  regs.forEach(function(r,i){
    var xc=x(i);
    if(r.fr!=null){var yf=y(r.fr,"fr");s+='<g><title>FR '+r.fr+' rpm · '+fFull(r.t)+'</title><path d="M'+(xc-4.5)+' '+(yf-4.5)+' L'+(xc+4.5)+' '+(yf+4.5)+' M'+(xc+4.5)+' '+(yf-4.5)+' L'+(xc-4.5)+' '+(yf+4.5)+'" stroke="#111" stroke-width="2.2"/><rect x="'+(xc-8)+'" y="'+(yf-8)+'" width="16" height="16" fill="transparent"/></g>'}
    if(r.fc!=null){var yc=y(r.fc,"fc");s+='<g><title>FC '+r.fc+' lpm · '+fFull(r.t)+'</title><circle cx="'+xc+'" cy="'+yc+'" r="5" fill="#fff" stroke="#1d4ed8" stroke-width="2.5"/></g>'}
    if(r.temp!=null){var yt=y(r.temp,"temp");s+='<g><title>Temperatura '+fmt(r.temp,1)+' °C · '+fFull(r.t)+'</title><circle cx="'+xc+'" cy="'+yt+'" r="5.5" fill="#d62828" stroke="#fff" stroke-width="1.5"/></g>'}
  });
  s+='</svg>';

function calcDia(dia,peso,pac){
  pac=pac||state;
  var regs=pac.balance.filter(function(b){return diaBalance(b.t)===dia});
  var tab={ingreso:{},egreso:{}}, tot={ingreso:{M:0,T:0,N:0},egreso:{M:0,T:0,N:0}};
  regs.forEach(function(b){var tu=turnoDe(b.t);var c=tab[b.tipo][b.concepto]=tab[b.tipo][b.concepto]||{M:0,T:0,N:0};c[tu]+=b.ml;tot[b.tipo][tu]+=b.ml});
  var ins=null;
  if(pac.ajustes.insensibles&&peso!=null){ins={};TURNOS.forEach(function(t){ins[t.id]=Math.round(peso*0.5*t.h);tot.egreso[t.id]+=ins[t.id]})}
  var sum=function(o){return o.M+o.T+o.N};
  return {regs:regs,tab:tab,tot:tot,ins:ins,ing:sum(tot.ingreso),egr:sum(tot.egreso)};
}
function signo(n){return (n>0?"+":"")+fmt(n)}
function hojaBalance(dia,peso){
  var c=calcDia(dia,peso), bal=c.ing-c.egr;
  var h='<div class="kpis">'+
    '<div class="kpi"><div class="k">Ingresos 24 h</div><div class="v">'+fmt(c.ing)+' ml</div></div>'+
    '<div class="kpi"><div class="k">Egresos 24 h</div><div class="v">'+fmt(c.egr)+' ml</div></div>'+
    '<div class="kpi"><div class="k">Balance 24 h</div><div class="v '+(bal>0?"pos":bal<0?"neg":"")+'">'+signo(bal)+' ml</div></div>'+
  '</div>';
  h+='<div class="tablewrap"><table><thead><tr><th>Concepto</th>'+TURNOS.map(function(t){return '<th class="num">'+t.n+'<br><span style="font-weight:400;text-transform:none">'+t.d+'</span></th>'}).join("")+'<th class="num">Total 24 h</th></tr></thead><tbody>';
  ["ingreso","egreso"].forEach(function(tipo){
    h+='<tr><td colspan="5" style="padding-top:12px;font-weight:700;color:'+(tipo==="ingreso"?"#0f766e":"#b45309")+'">'+(tipo==="ingreso"?"INGRESOS":"EGRESOS")+'</td></tr>';
    var nombres=Object.keys(c.tab[tipo]);
    nombres.sort(function(a,b){return CONCEPTOS[tipo].indexOf(a)-CONCEPTOS[tipo].indexOf(b)});
    nombres.forEach(function(k){var o=c.tab[tipo][k];h+='<tr><td>'+esc(k)+'</td>'+TURNOS.map(function(t){return '<td class="num">'+(o[t.id]?fmt(o[t.id]):"—")+'</td>'}).join("")+'<td class="num">'+fmt(o.M+o.T+o.N)+'</td></tr>'});
    if(tipo==="egreso"&&c.ins){h+='<tr><td>Pérdidas insensibles <span class="hint">(0,5 ml/kg/h)</span></td>'+TURNOS.map(function(t){return '<td class="num">'+fmt(c.ins[t.id])+'</td>'}).join("")+'<td class="num">'+fmt(c.ins.M+c.ins.T+c.ins.N)+'</td></tr>'}
    if(!nombres.length&&!(tipo==="egreso"&&c.ins)) h+='<tr><td colspan="5" class="hint">Sin registros</td></tr>';
    var o=c.tot[tipo];
    h+='<tr class="sub"><td>Total '+(tipo==="ingreso"?"ingresos":"egresos")+'</td>'+TURNOS.map(function(t){return '<td class="num">'+fmt(o[t.id])+'</td>'}).join("")+'<td class="num">'+fmt(o.M+o.T+o.N)+'</td></tr>';
  });
  h+='<tr class="tot"><td>BALANCE</td>'+TURNOS.map(function(t){var b=c.tot.ingreso[t.id]-c.tot.egreso[t.id];return '<td class="num '+(b>0?"pos":b<0?"neg":"")+'">'+signo(b)+'</td>'}).join("")+'<td class="num '+(bal>0?"pos":bal<0?"neg":"")+'">'+signo(bal)+'</td></tr>';
  h+='</tbody></table></div>';
  h+='<p class="hint">Balance = ingresos − egresos. Positivo: el paciente retiene líquidos; negativo: pierde más de lo que recibe.'+(c.ins?' Las pérdidas insensibles son una estimación y aumentan con la fiebre, la taquipnea o la sudoración.':'')+'</p>';
  return h;
}
function tablaBH(dia){
  var regs=state.balance.filter(function(b){return diaBalance(b.t)===dia}).sort(function(a,b){return b.t-a.t});
  var h='<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Turno</th><th>Tipo</th><th>Concepto</th><th class="num">ml</th><th>Observaciones</th><th></th></tr></thead><tbody>';
  regs.forEach(function(b){var tu=TURNOS.filter(function(t){return t.id===turnoDe(b.t)})[0];
    h+='<tr><td>'+fFecha(b.t)+'</td><td>'+fHora(b.t)+'</td><td>'+tu.n+'</td><td style="color:'+(b.tipo==="ingreso"?"#0f766e":"#b45309")+';font-weight:600">'+(b.tipo==="ingreso"?"Ingreso":"Egreso")+'</td><td>'+esc(b.concepto)+'</td><td class="num">'+fmt(b.ml)+'</td><td>'+esc(b.obs||"")+'</td><td><button class="small danger" data-delbh="'+b.id+'">Borrar</button></td></tr>'});

}
function csvBH(dia){
  var l=["Fecha;Hora;Turno;Tipo;Concepto;ml;Observaciones"];
  state.balance.filter(function(b){return diaBalance(b.t)===dia}).sort(function(a,b){return a.t-b.t}).forEach(function(b){
    l.push([fFecha(b.t)+"/"+new Date(b.t).getFullYear(),fHora(b.t),turnoDe(b.t),b.tipo,b.concepto,b.ml,(b.obs||"").replace(/;/g,",")].join(";"))});
  return l.join("\n");
}
function evolucion(dias,peso){
  var datos=dias.map(function(d){var c=calcDia(d,peso);return {d:d,ing:c.ing,egr:c.egr,bal:c.ing-c.egr}});
  var max=Math.max.apply(null,datos.map(function(o){return Math.max(o.ing,o.egr)}).concat([1]));
  var h='<div class="tablewrap"><table><thead><tr><th>Día (8 → 8 h)</th><th class="num">Ingresos</th><th class="num">Egresos</th><th class="num">Balance</th><th class="num">Acumulado</th><th style="width:40%"></th></tr></thead><tbody>';
  var acu=0;
  datos.forEach(function(o){acu+=o.bal;
    h+='<tr><td>'+fDia(o.d)+'</td><td class="num">'+fmt(o.ing)+'</td><td class="num">'+fmt(o.egr)+'</td><td class="num '+(o.bal>0?"pos":o.bal<0?"neg":"")+'">'+signo(o.bal)+'</td><td class="num '+(acu>0?"pos":acu<0?"neg":"")+'">'+signo(acu)+'</td>'+
    '<td><div style="height:8px;background:#0f766e;border-radius:4px;width:'+(o.ing/max*100)+'%;margin-bottom:3px" title="Ingresos"></div><div style="height:8px;background:#b45309;border-radius:4px;width:'+(o.egr/max*100)+'%" title="Egresos"></div></td></tr>'});
  return h+'</tbody></table></div><p class="hint"><span style="color:#0f766e;font-weight:700">■</span> Ingresos &nbsp; <span style="color:#b45309;font-weight:700">■</span> Egresos</p>';
}

  $("#fTT").addEventListener("submit",function(e){
    e.preventDefault();var f=e.target,med=f.med.value.trim();if(!med)return;
    if(ed){ed.med=med;ed.dosis=f.dosis.value.trim();ed.via=f.via.value;ed.pauta=f.pauta.value.trim();editTT=null;toast("Medicamento actualizado")}
    else{p.tto.push({id:uid(),med:med,dosis:f.dosis.value.trim(),via:f.via.value,pauta:f.pauta.value.trim(),alta:Date.now(),baja:null});toast("Medicamento añadido")}

    var ya=p.admin.filter(function(a){return a.tto===id&&diaAdm(a)===diaTto&&a.slot===hh});
    if(ya.length)p.admin=p.admin.filter(function(a){return ya.indexOf(a)<0});

    guardar();renderTratamiento()})});
  v.querySelectorAll("[data-dar]").forEach(function(b){b.addEventListener("click",function(){
    var inp=v.querySelector('[data-hora="'+b.dataset.dar+'"]'),hm=inp.value;
    var hh,mm;if(hm){hh=+hm.split(":")[0];mm=+hm.split(":")[1]}else{var n=new Date();hh=n.getHours();mm=n.getMinutes()}
    p.admin.push({id:uid(),tto:b.dataset.dar,t:tAt(diaTto,hh,mm),dia:diaTto});guardar();renderTratamiento();toast("Dosis registrada a las "+pad(hh)+":"+pad(mm))})});
  v.querySelectorAll("[data-quitar]").forEach(function(b){b.addEventListener("click",function(){

  v.querySelectorAll("[data-delad]").forEach(function(b){b.addEventListener("click",function(){

  v.querySelectorAll("[data-elim]").forEach(function(b){b.addEventListener("click",function(){

var HORA_TURNO={M:10,T:17,N:23};

  $("#fCUR").addEventListener("submit",function(e){
    e.preventDefault();var f=e.target,t=new Date(f.t.value).getTime();if(isNaN(t))return;
    p.curas.push({id:uid(),t:t,tipo:f.tipo.value,zona:f.zona.value.trim(),material:f.material.value.trim(),evol:f.evol.value,obs:f.obs.value.trim()});
    guardar();renderCuras();toast("Cura registrada");
  });
  v.querySelectorAll("[data-delcur]").forEach(function(b){b.addEventListener("click",function(){
    p.curas=p.curas.filter(function(r){return r.id!==b.dataset.delcur});guardar();renderCuras()})});
}

/* ---- Pruebas diagnósticas ---- */
function renderPruebas(){
  var v=$("#vista"), p=state;
  var h='<section class="card"><h2>Nueva prueba diagnóstica</h2><form id="fPR" class="grid form-gen" autocomplete="off">'+
    '<label>Fecha y hora<input type="datetime-local" name="t" required value="'+ahoraLocal()+'"></label>'+
    '<label>Prueba<select name="cat"><option value="">— Elegir —</option>'+opts(PRUEBAS_CAT,"")+'</select></label>'+
    '<label>…o escribir otra<input name="otra" placeholder="p. ej. Test de embarazo"></label>'+
    '<label>Estado<select name="estado">'+opts(ESTADOS_PR,"Realizada")+'</select></label>'+
    '<label>Observaciones / resultado<input name="obs" placeholder="Opcional"></label>'+
    '<div class="toolbar" style="margin:0"><button class="primary" type="submit">Añadir</button></div></form></section>';
  var reg=p.pruebas.slice().sort(porFechaDesc);
  h+='<section class="card"><h2>Pruebas del paciente</h2>';
  if(!reg.length)h+='<div class="empty">Aún no hay pruebas registradas.</div>';
  else{
    h+='<div class="tablewrap"><table><thead><tr><th>Prueba</th><th>Estado</th><th>Fecha</th><th>Hora</th><th>Observaciones / resultado</th><th></th></tr></thead><tbody>';
    reg.forEach(function(r){h+='<tr><td><b>'+esc(r.tipo)+'</b></td><td><select data-est="'+r.id+'">'+opts(ESTADOS_PR,r.estado)+'</select></td>'+filaHist(r.t)+'<td><input data-pobs="'+r.id+'" type="text" value="'+esc(r.obs||"")+'" style="width:100%;min-width:200px"></td><td><button class="small danger" data-delpr="'+r.id+'">Borrar</button></td></tr>'});
    h+='</tbody></table></div><p class="hint">Puedes cambiar el estado o escribir el resultado directamente en la tabla.</p>';
  }
  v.innerHTML=h+'</section>';
  $("#fPR").addEventListener("submit",function(e){
    e.preventDefault();var f=e.target,t=new Date(f.t.value).getTime(),n=(f.otra.value.trim()||f.cat.value);if(isNaN(t)||!n)return;
    p.pruebas.push({id:uid(),t:t,tipo:n,estado:f.estado.value,obs:f.obs.value.trim()});guardar();renderPruebas();toast("Prueba registrada");
  });
  function pr(id){return p.pruebas.filter(function(r){return r.id===id})[0]}
  v.querySelectorAll("[data-est]").forEach(function(s){s.addEventListener("change",function(){pr(s.dataset.est).estado=s.value;guardar()})});
  v.querySelectorAll("[data-pobs]").forEach(function(i){i.addEventListener("change",function(){pr(i.dataset.pobs).obs=i.value.trim();guardar()})});
  v.querySelectorAll("[data-delpr]").forEach(function(b){b.addEventListener("click",function(){
    p.pruebas=p.pruebas.filter(function(r){return r.id!==b.dataset.delpr});guardar();renderPruebas()})});
}

}
})();
